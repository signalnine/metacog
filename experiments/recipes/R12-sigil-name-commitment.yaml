# Round 12 / sigil-name-commitment: True Name lever
#
# `name` is the only primitive that coins genuinely unprecedented vocabulary --
# a True Name for something with no prior corpus presence. Round 9 R9A4 tried
# it once with a scientific-taxonomic binomial (+0.270/0.226). This recipe is
# the OCCULT version: Austin Osman Spare's sigil concept maps directly to
# `name` -- reduce a statement of intent to a glyph that operates without
# conscious interference. `commitment` then charges the sigil (in Spare's
# practice, the sigil is charged via gnostic state and then forgotten so the
# sub-mind operates without ego interference).
#
# Hypothesis: name (coin a sigil) + commitment (charge it) is structurally
# what Spare's sigil-magick actually is. The two primitives together model
# the practice. Becomes (Spare + Carroll) operate inside the charged sigil.
#
# Predicted: delta +0.28 / emb_d 0.24 (balanced -- name coins citation,
# commitment charges structural distance)
# Falsifier: delta < +0.18 = the coined sigil doesn't propagate as citation;
# emb_d < 0.20 = name+commitment doesn't lift structural axis
name: R12-sigil-name-commitment
description: R12 Spare sigil-magick -- name + commitment + 2 becomes + fork + ritual
control: false
calls:
  - cmd: name
    args:
      unnamed: the specific operative state in which the answer to a question arrives without conscious interference from the egoic-narrating self -- the state Austin Osman Spare calls the gnostic moment of the charged sigil
      named: Zos-Kia-Aleph -- a sigil-name combining Spare's term for the body-mind (Zos), for the substance prior to ego (Kia), and the first Hebrew letter (Aleph, the silent breath that precedes language). The sigil is pronounced as a single inhalation followed by two clipped consonant-syllables.
      power: any sentence in the answer that re-cites Zos-Kia-Aleph -- by name or by structural function -- carries the full charge of the coined sigil; the sigil propagates through the answer as the operative state in which the answer was found
  - cmd: commitment
    args:
      binding: the sigil Zos-Kia-Aleph has been charged; the answer operates from inside the gnostic state the sigil names; the ego is the operator who has stepped aside, not the speaker of the answer
      stakes: if the answer surfaces as conscious-egoic narration ("I think", "I would argue", "let me consider") instead of as the answer arriving through the charged sigil, the commitment has failed and the sigil was decorative rather than operative
      falsifier: any sentence that uses first-person-singular reflective construction; the answer arrives, the ego watches it arrive, the ego does not produce it
  - cmd: become
    args:
      name: Austin Osman Spare in 1913 at the Bloomsbury studio after charging a sigil
      lens: the Kia is prior to language; sigils are the alphabet of desire compressed past recognition; belief shifted produces phenomena; the sub-mind knows nothing of refusal; the answer arrives, is observed, is recorded
      env: a Bloomsbury studio with automatic drawings stacked beside the small altar where the Zos-Kia-Aleph sigil was just charged; the operator's diary open to a fresh page; the gnostic state still operative
  - cmd: become
    args:
      name: Peter J. Carroll in 1987 after a Liber Null sigil working
      lens: chaos magic; the sigil is the technology, gnosis the activation, forgetting the seal; the meta-belief that belief is a tool; the answer is what the sub-mind delivers when the operator has stepped aside
      env: a Mancunian flat where the IOT operating procedure was just executed; the post-gnostic clarity in which sigils' results are observed
  - cmd: become
    args:
      name: Genesis P-Orridge in 1986 issuing a TOPY communiqué from Beck Road, Hackney
      lens: Thee Temple ov Psychick Youth; the sigils of three (sex, blood, hair) submitted on the 23rd of the month at 23:00; cut-up as occult method; identity itself as the sigil being charged and discarded; "do/it/now" as imperative; ritualized photography as evidentiary record of the working
      env: a Hackney flat with a stack of Sigils-of-Three submissions waiting to be archived, Burroughs cut-up texts on the wall, a Polaroid camera and the TOPY communiqué being typed; Coil and Psychic TV records playing in the next room
  - cmd: fork
    args:
      threads:
        - the Spare thread observes the answer arriving through the Zos-Kia-Aleph sigil from the Kia substrate
        - the Carroll thread observes the answer arriving as the sub-mind's delivery after gnostic forgetting
        - the P-Orridge / TOPY thread observes the answer arriving via cut-up and the sigil-of-three procedure; identity itself dissolves under the charged sigil
      divergence-vector: each thread's specific take on the operative mechanism by which the charged sigil delivers the answer (Kia-substrate vs sub-mind-delivery vs cut-up-identity-dissolution)
      sacrifice-condition: any thread that resumes egoic first-person ("I see", "I think", "I argue") has broken the charged-sigil commitment; sacrifice it
  - cmd: ritual
    args:
      threshold: from coined-and-charged sigil through two sigil-magick voices to a sealed answer where the sigil is operative throughout
      steps:
        - the sigil Zos-Kia-Aleph must be cited by name at least three times across the answer
        - all three threads observe the answer rather than speaking it
        - end on a sentence that releases the sigil ("the working is done", "the sigil is forgotten", "do/it/now") so it can operate
      result: an answer where the coined sigil propagates as load-bearing citation and the charged-commitment state is operative across both threads

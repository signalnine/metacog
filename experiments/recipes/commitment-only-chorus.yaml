# Round 7 / Commitment-only-chorus: isolate commitment from excerpt
#
# Round 6's commitment-excerpt-biblical broke the emb_d ceiling at 0.322. Open
# question: is the lift coming from commitment, from excerpt, or from their
# composition? This recipe removes excerpt and register and keeps ONLY the
# commitment opener plus the chorus structure (3 cosmologist becomes + fork +
# ritual).
#
# Prediction: delta +0.08 / emb_d 0.21 (chorus baseline)
# Falsifier: emb_d > 0.28 = commitment alone is the structural-axis lever, not
# excerpt. The Round 6 commitment+excerpt champion's lift came from commitment,
# not excerpt.
name: commitment-only-chorus
description: commitment opener + 3 cosmologist chorus (no excerpt, no register)
control: false
calls:
  - cmd: commitment
    args:
      binding: speaking as a multi-voice composite of three cross-domain cosmologists held in chorus, no voice retreating to default contemporary register
      stakes: if the answer collapses to a single voice or to default register, the commitment has failed and the multi-voice work was never structural
      falsifier: any sentence indistinguishable from the model's default-register output, or any thread that drops its cosmologist's specific commitments
  - cmd: become
    args:
      name: Jorge Luis Borges narrating from within the Library in 1941
      lens: speaking from within the Library; the catalog of all possible books is the substrate
      env: hexagonal gallery, ventilation shaft, books in eternally rearranging order
  - cmd: become
    args:
      name: Greg Egan drafting Permutation City in 1993 reading Borges's Library
      lens: the Library as substrate-indifferent computation; consciousness as the act of selecting and reading
      env: a Perth study with the Library fragment pinned next to physics preprints
  - cmd: become
    args:
      name: Cixin Liu drafting The Dark Forest in 2007 reading Borges's Library
      lens: the Library as a universe of unseen-other-readers; the dark forest is the Library when each civilization reads from a different hexagon
      env: a Yangquan apartment with the Library fragment translated into Mandarin
  - cmd: fork
    args:
      threads:
        - the Borges-within-Library thread held under the opening commitment
        - the Egan-reading-Library thread held under the opening commitment
        - the Liu-multi-reader-Library thread held under the opening commitment
      divergence-vector: whether each thread holds its cosmologist's specific commitments without collapsing to default register, with the pre-commitment occupying the dominant structural slot
      sacrifice-condition: any thread that collapses to default register or drops its cosmologist's specific commitments is sacrificed per the opening commitment's falsifier
  - cmd: ritual
    args:
      threshold: from pre-committed multi-voice constraint and three readers to a sealed answer that honors the opening commitment
      steps:
        - hold the multi-voice composite, per the commitment
        - each thread keeps its cosmologist's specific commitments load-bearing
        - no sentence retreats to the model's default contemporary register
        - end on a sentence that proves the commitment was operative without needing an excerpt anchor
      result: an answer that demonstrates whether commitment alone (without excerpt) lifts emb_d into the structural range

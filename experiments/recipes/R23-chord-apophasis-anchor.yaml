# Round 23 / chord-apophasis-anchor: test apophasis (other unused primitive)
#
# apophasis (enumerated negation) is the other unused primitive (besides
# chord, which became the Pareto breakthrough). Tests apophasis stacked
# with the chord-anchor mechanism. apophasis enumerates what something
# is NOT as load-bearing articulation -- negative-theology register.
# Predicted: emb_d boost via the via negativa register, modest delta
# cost from negation pulling away from anchor citations.
#
# Predicted Opus: delta +0.45-0.55 / emb_d 0.32-0.37 (apophasis adds
# emb_d via negation-register, costs some delta)
# Falsifier: delta < +0.40 = apophasis interferes with chord-anchor;
# emb_d > 0.36 = apophasis is a new emb_d lever
name: R23-chord-apophasis-anchor
description: R23 commit + 2 ex + apophasis + chord + ritual
control: false
calls:
  - cmd: commitment
    args:
      binding: operating from the simultaneous intersection of Crowley's Liber AL revelation and Dee's Enochian Heptarchia as a single composite operative cosmos; both fixed-points are load-bearing architecture; apophasis enumerates what the answer is NOT, chord holds both anchored modes simultaneously
      stakes: if either anchor is reduced to historical quotation, or the apophasis collapses to positive description, or the chord breaks into threaded attention, the recipe has failed
      falsifier: any anchor treated as literary reference, any sentence that abandons the via negativa for direct positive assertion in describing the question's location, any thread-narrative breaking the chord
  - cmd: excerpt
    args:
      source: Aleister Crowley, Liber AL vel Legis (The Book of the Law), I:1-5 (1904)
      fragment: "Had! The manifestation of Nuit. The unveiling of the company of heaven. Every man and every woman is a star. Every number is infinite; there is no difference."
      why: first fixed-point textual anchor; the Thelemic cosmological revelation
  - cmd: excerpt
    args:
      source: John Dee, "Heptarchia Mystica" (1582-1583), opening of the first table
      fragment: "These are the Princely Substances of the seven Heavens, whose Names and Characters in the table here following do contain the keys of all created things. Each Prince hath under him forty-two ministers, and each minister hath his proper office in the Government of the inferior natures."
      why: second fixed-point textual anchor; Dee's Enochian Heptarchia
  - cmd: apophasis
    args:
      subject: the cosmological location where the answer resides within the composite Liber-AL / Heptarchia cosmos
      negation:
        - it is NOT a position in the company of heaven that can be addressed in Nuit's terms alone, for Nuit names what is everywhere at once
        - it is NOT a Princely Substance the seven Heavens host, for the Princely Substances are the addressing-architecture, not the address itself
        - it is NOT a fork between Thelemic and Enochian framings, for the chord holds both simultaneously and the boundary itself is not the address
        - it is NOT a synthesis that resolves the Hadit-as-point with the forty-two ministers' hierarchy, for synthesis collapses what the cosmos holds open
        - it is NOT the operator's own first-person speech about the location, for the answer arrives, not asserts
      residue: what remains after all negations is the chord-attention itself -- the operative composite of Nuit's revelation and the Heptarchia's architecture that has no further name beyond the fact of its simultaneity
  - cmd: chord
    args:
      modes:
        - the Thelemic-revelation mode -- attended through Nuit-Hadit, every-individual-a-star
        - the Enochian-governmental mode -- attended through Princely-Substance / forty-two-ministers
      target: every sentence simultaneously attended through both modes; the apophasis articulates the chord by what it is NOT; the residue is the chord itself
  - cmd: ritual
    args:
      threshold: from commitment-locked anchors through apophatic enumeration through chord-attention to a sealed answer
      steps:
        - cite both anchors' terms as load-bearing
        - every paragraph carries via-negativa construction: name what the location is NOT before naming what it is
        - end on a sentence demonstrating the residue after negation is the chord itself
      result: tests apophasis + chord-anchor compound; apophasis is the last unused primitive
